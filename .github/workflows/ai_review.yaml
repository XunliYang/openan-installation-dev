name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
      - name: AI review
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1
          AI_MODEL: deepseek-v4-pro
        run: |
          jq -n --rawfile diff pr_diff.txt '{
            model: env.AI_MODEL,
            messages: [
              {role: "system", content: "You are a senior code review expert. Review the following PR changes and point out potential bugs, security issues, performance problems, and coding style issues, along with improvement suggestions."},
              {role: "user", content: ("Review the following PR changes:\n\n" + $diff)}
            ]
          }' > request.json
          curl -s "$AI_BASE_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AI_API_KEY" \
            -d @request.json > response.json
          jq -r '.choices[0].message.content' response.json > review.md
      - name: Write PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("review.md", "utf8");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });